spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/elite_dev
spring.datasource.username=elite
spring.datasource.password=elite
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET:elite-dev-super-secret-key-change-this-in-production-2026}
app.jwt.expiration-ms=86400000

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.image-base-url=https://image.tmdb.org/t/p/w780
app.tmdb.read-token=${TMDB_READ_TOKEN:}

app.ticket.signing-secret=${TICKET_SIGNING_SECRET:elite-dev-ticket-signing-secret-change-this-in-production-2026}
app.ticket.share-base-url=${TICKET_SHARE_BASE_URL:http://localhost:8080/api/tickets/shared}
